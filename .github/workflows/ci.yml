name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build + wire test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install clang and the audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libavformat-dev libavcodec-dev \
            libswresample-dev libavutil-dev libavfilter-dev libopus-dev libz-dev

      - name: Build
        run: CXX=clang++ ./build.sh

  fuzz-smoke:
    name: fuzz smoke (libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Ubuntu 26.04 (the current ubuntu-latest) ships a recent clang; its own
      # compiler-rt is enough for -fsanitize=fuzzer. The fallback covers images
      # where the unversioned package name is not provided.
      - name: Install clang + compiler-rt
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          sudo apt-get install -y libclang-rt-dev || \
            sudo apt-get install -y "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      - name: Build fuzzers
        run: CXX=clang++ ./fuzz/build.sh

      # Each target gets a scratch corpus so libFuzzer's new units do not dirty
      # the checkout, and a fixed time budget keeps the job predictable.
      - name: Run fuzz targets
        run: |
          for target in input input_seq fields http; do
            echo "::group::fuzz $target"
            case "$target" in
              input)     src=fuzz/corpus ;;
              input_seq) src=fuzz/corpus_seq ;;
              fields)    src=fuzz/corpus_fields ;;
              http)      src=fuzz/corpus_http ;;
            esac
            dir="/tmp/corpus_$target"
            mkdir -p "$dir"
            cp -r "$src"/. "$dir"/
            ./fuzz/fuzz_$target "$dir" -timeout=5 -max_total_time=20 -rss_limit_mb=2048
            echo "::endgroup::"
          done
