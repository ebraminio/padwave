name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build + wire test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang 19 and the audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libavformat-dev libavcodec-dev \
            libswresample-dev libavutil-dev libopus-dev libz-dev
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 19

      - name: Build
        run: CXX=clang++-19 ./build.sh

  fuzz-smoke:
    name: fuzz smoke (libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang 19 + compiler-rt
        run: |
          sudo apt-get update
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 19
          sudo apt-get install -y libclang-rt-19-dev

      - name: Build fuzzers
        run: CXX=clang++-19 ./fuzz/build.sh

      # Each target gets a scratch corpus so libFuzzer's new units do not dirty
      # the checkout, and a fixed time budget keeps the job predictable.
      - name: Run fuzz targets
        run: |
          for target in input input_seq fields http; do
            echo "::group::fuzz $target"
            case "$target" in
              input)     src=fuzz/corpus ;;
              input_seq) src=fuzz/corpus_seq ;;
              fields)    src=fuzz/corpus_fields ;;
              http)      src=fuzz/corpus_http ;;
            esac
            dir="/tmp/corpus_$target"
            mkdir -p "$dir"
            cp -r "$src"/. "$dir"/
            ./fuzz/fuzz_$target "$dir" -timeout=5 -max_total_time=20 -rss_limit_mb=2048
            echo "::endgroup::"
          done
